# Alembic configuration.
#
# The database URL is intentionally NOT set here; it is injected at runtime from
# application settings in app/alembic/env.py (settings.SQLALCHEMY_DATABASE_URI_SYNC).
[alembic]
script_location = app/alembic
prepend_sys_path = .
# Use a path-separator friendly for the OS; "os" lets Alembic decide.
version_path_separator = os

[post_write_hooks]
# Format migration files with Ruff after they are generated.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
