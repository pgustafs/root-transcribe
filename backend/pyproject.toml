[project]
name = "root-transcribe"
version = "0.1.0"
description = "Workspace-based audio transcription and speaker diarization."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Peter Gustafsson" }]
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.18",
    "email-validator>=2.2.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "openai>=1.59.0",
    "httpx>=0.28.0",
    "prometheus-client>=0.21.0",
    "boto3>=1.35.0",
    "cryptography>=44.0.0",
    "python-docx>=1.2.0",
    "reportlab>=5.0.0",
    "markdown-it-py>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
]
ffmpeg = [
    "imageio-ffmpeg>=0.5.1",
]
stt = [
    "pyannote.audio>=4.0.0",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "soundfile>=0.12.1",
    "imageio-ffmpeg>=0.5.1",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "FAST"]
ignore = [
    "B008", # function calls in argument defaults — required by FastAPI Depends()/Query()
]

[tool.ruff.lint.per-file-ignores]
"app/alembic/*" = ["E501"]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "unit: pure logic tests, no external resources",
    "integration: tests that hit a real database",
    "functional: end-to-end API tests through the ASGI app",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*", "tests/*"]
