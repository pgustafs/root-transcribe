<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand/favicon-trefargad.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APP NAME · enrooted</title>
    <script>
      // Apply the saved theme before the first paint (no light flash in dark mode).
      // Same key/values as next-themes in App.tsx: "light" | "dark" | "system".
      try {
        var t = localStorage.getItem("APP-theme") || "system"
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
