<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0D1835" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Root Transcribe by Enrooted — transcription and speaker diarization"
    />
    <title>Root Transcribe Console</title>
    <script>
      // Apply the saved theme before the first paint (no light flash in dark
      // mode). Same key and values as src/hooks/useTheme.ts.
      try {
        var t = localStorage.getItem("root_transcribe.theme") || "system";
        var dark =
          t === "dark" ||
          (t === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
