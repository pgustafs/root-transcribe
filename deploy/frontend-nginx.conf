# Server-context config for the UBI nginx image. It is included inside the
# default server block (listen 8080, root /opt/app-root/src) via
# /opt/app-root/etc/nginx.default.d/*.conf.

# SPA fallback: serve index.html for client-side routes.
location / {
    try_files $uri $uri/ /index.html;

    # Never cache the SPA shell. index.html references fingerprinted /assets/
    # files by hash, so it MUST be revalidated on every load — otherwise a
    # cached index.html keeps pointing at stale asset hashes and a rebuild's
    # new CSS/JS is never picked up. The hashed assets below stay immutable.
    add_header Cache-Control "no-cache";
}

# Cache fingerprinted build assets aggressively.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Study notes: the recording browser listens here for keyboard-shortcut presses
# (server-sent events). The stream stays open for the whole recording and must
# not be buffered, or a press would arrive late.
location = /api/v1/study/commands/stream {
    proxy_pass http://localhost:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

# Reverse-proxy API calls to the backend in the same pod (same-origin).
location /api/ {
    proxy_pass http://localhost:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Audio uploads and resumable parts pass through the same-origin API.
    client_max_body_size 500m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# The dashboard polls the backend health endpoint (served at the root).
location = /health {
    proxy_pass http://localhost:8000/health;
}

