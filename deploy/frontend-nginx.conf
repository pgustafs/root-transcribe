# Server block for the Red Hat Hardened nginx image (hi/nginx). The image's own
# /etc/nginx/nginx.conf includes /etc/nginx/conf.d/*.conf inside http {}; this
# file replaces its conf.d/default.conf. nginx runs as UID 65532 on port 8080.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The image's /var/lib/nginx/tmp belongs to another UID. Keep request and
    # response buffers in /tmp, which is writable: nginx creates these folders at
    # start (but not their parents), so large uploads and proxied audio
    # downloads can spill to disk.
    client_body_temp_path /tmp/nginx-client_body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server_tokens off;

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;

        # Never cache the SPA shell. index.html references fingerprinted /assets/
        # files by hash, so it MUST be revalidated on every load — otherwise a
        # cached index.html keeps pointing at stale asset hashes and a rebuild's
        # new CSS/JS is never picked up. The hashed assets below stay immutable.
        add_header Cache-Control "no-cache";
    }

    # Cache fingerprinted build assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy API calls to the backend in the same pod (same-origin).
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Audio uploads and resumable parts pass through the same-origin API.
        client_max_body_size 500m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The dashboard polls the backend health endpoint (served at the root).
    location = /health {
        proxy_pass http://localhost:8000/health;
    }
}
